name: remindo_app
description: "Remindo - Gamified Reminder, Focus Timer & Student Finance App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Local SQLite & Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Background Services, Notifications & Alarms
  flutter_local_notifications: ^17.2.2
  android_alarm_manager_plus: ^4.0.3
  flutter_overlay_window: ^0.4.5
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1

  # File, Share, Utility & Remote Catalog
  file_picker: ^8.1.6
  share_plus: ^10.1.4
  intl: ^0.19.0
  http: ^1.2.1

  # Typography & Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

dependency_overrides:
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
