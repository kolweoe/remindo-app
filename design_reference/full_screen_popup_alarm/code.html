<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Screen Popup Alarm | Remindo</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */
globalThis.tailwind = globalThis.tailwind || {};
globalThis.tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        'primary': '#7A4B2A',
        'on-primary': '#FFFFFF',
        'primary-container': '#F9B98F',
        'on-primary-container': '#311300',
        'secondary': '#2E7D32',
        'on-secondary': '#FFFFFF',
        'secondary-container': '#C8FFBF',
        'on-secondary-container': '#002204',
        'accent': '#F59E0B',
        'on-accent': '#311300',
        'accent-container': '#FEF3C7',
        'on-accent-container': '#4D2600',
        'surface': '#F5E9D3',
        'on-surface': '#2C160B',
        'surface-container-low': '#FFF8EB',
        'on-surface-container-low': '#2C160B',
        'surface-container': '#EFE0C6',
        'on-surface-container': '#2C160B',
        'surface-container-high': '#E2C89E',
        'on-surface-container-high': '#2C160B',
        'surface-nav': '#4E2F1B',
        'on-surface-nav': '#FFFFFF',
        'outline': '#4E2F1B',
        'outline-variant': '#C9A679',
        'success': '#2E7D32',
        'on-success': '#FFFFFF',
        'warning': '#D97706',
        'on-warning': '#2A2A2A',

      },
      borderRadius: {

        'DEFAULT': '2px',

        'lg': '4px',
        'xl': '4px',
        'full': '9999px',
      },
      spacing: {
        'unit-xs': '4px',
        'unit-sm': '8px',
        'unit-md': '12px',
        'unit-lg': '16px',
        'unit-xl': '24px',
        'page-margin': '16px',
        'nav-height': '72px',
      },
      fontFamily: {
        'display': ['"Boogaloo"', 'sans-serif'],
        'headline': ['"Boogaloo"', 'sans-serif'],
        'title': ['"Capriola"', 'sans-serif'],
        'body': ['"Capriola"', 'sans-serif'],
        'label': ['"Capriola"', 'sans-serif'],
        'mono': ['"Spline Sans Mono"', 'monospace'],
      },
      fontSize: {
        'display-lg': ['44px', { lineHeight: '48px', letterSpacing: '0px', fontWeight: '400' }],
        'display-lg-mobile': ['32px', { lineHeight: '36px', letterSpacing: '0px', fontWeight: '400' }],
        'headline-lg': ['28px', { lineHeight: '34px', letterSpacing: '0px', fontWeight: '400' }],
        'headline-md': ['22px', { lineHeight: '28px', letterSpacing: '0px', fontWeight: '400' }],
        'title-md': ['16px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '400' }],
        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
        'label-lg': ['13px', { lineHeight: '18px', letterSpacing: '0.1px', fontWeight: '400' }],
        'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.2px', fontWeight: '400' }],
        'mono-lg': ['20px', { lineHeight: '24px', letterSpacing: '-0.2px', fontWeight: '700' }],
        'mono-sm': ['12px', { lineHeight: '16px', letterSpacing: '0px', fontWeight: '600' }],
      },
      transitionDuration: {
        'button-press': '100ms',
        'surface-enter': '220ms',
      },
      transitionDelay: {
        'button-press': '0ms',
        'surface-enter': '0ms',
      },
      transitionTimingFunction: {
        'button-press': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',
      },
    },
  },
};
if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&amp;family=Capriola&amp;family=Spline+Sans+Mono:wght@600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
    .pixel-shadow-sm {
      box-shadow: 0 2px 0 #2D1B4E;
    }
    .pixel-shadow-md {
      box-shadow: 0 4px 0 #2D1B4E;
    }
    .pixel-shadow-card {
      box-shadow: 0 6px 0 #2D1B4E;
    }
  </style>
</head>
<body class="bg-surface-nav text-on-surface-nav antialiased">
  <div class="min-h-[884px] max-w-md mx-auto flex flex-col justify-between bg-surface-nav border-x-2 border-outline p-unit-lg relative" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Top Lock-Screen Status & Sparkle Header -->
    <header class="flex items-center justify-between pt-unit-sm">
      <div class="inline-flex items-center gap-unit-xs bg-primary text-on-primary border-2 border-outline rounded-full px-unit-md py-unit-xs pixel-shadow-sm">
        <span class="material-symbols-outlined text-accent text-[16px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">notifications_active</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Alarm Quest Aktif</span>
      </div>
      <div class="flex items-center gap-unit-xs text-accent">
        <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">auto_awesome</span>
        <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">star</span>
      </div>
    </header>

    <!-- Main Full-Screen Alarm Content -->
    <main class="flex-1 flex flex-col items-center justify-center gap-unit-xl py-unit-lg">

      <!-- Large Digital Clock & Date -->
      <div class="flex flex-col items-center gap-unit-xs text-center">
        <time datetime="19:00" data-design-text-token="display-lg-mobile" class="font-mono text-display-lg-mobile text-on-surface-nav tabular-nums tracking-wider">19:00</time>
        <p data-design-text-token="title-md" class="font-title text-title-md text-outline-variant">Kamis, 19 November</p>
      </div>

      <!-- Cream Parchment RPG Character Popup Card -->
      <article data-component-id="card-action" data-component-type="card" data-component-variant="action" class="w-full bg-surface-container-low text-on-surface-container-low border-2 border-outline rounded-xl p-unit-lg pixel-shadow-card flex flex-col gap-unit-lg">
        <!-- Character + Quest Message Row -->
        <div class="flex items-center gap-unit-md">
          <div class="w-28 h-28 bg-surface-container-low border-2 border-outline rounded-lg overflow-hidden shrink-0 pixel-shadow-sm">
            <img src="https://lh3.googleusercontent.com/aida/ALJJyrBAe0gkIW4SxBTNvtTDczJE3CtICTLG019kZIk1WNf26baYQ57iCFBY26sNh3_ljGGCRz9K48HSpLwO3wSnlJCdwQP4--VHVXJ2lgt-V9bXSEgtVjeecr0c4bDXfw4ghvNOU9BzM7NUGed6ntY9m8bzpKC_D3_reTisjFwrPGFjMzw1yfO7uhObvTu9SK5MoIz9WFSehiGxHUNlgxrB1pSFhcoUy0f7eDzXOuNgLU11xK6-u_uKkXX7Yts" alt="Karakter hero pixel art memegang lonceng alarm emas" class="w-full h-full object-cover">
          </div>

          <div class="flex-1 flex flex-col gap-unit-xs min-w-0">
            <span class="inline-flex self-start items-center gap-unit-xs bg-error text-on-error border border-outline rounded-sm px-unit-xs py-0">
              <span data-design-text-token="label-sm" class="font-label text-label-sm">HARD QUEST</span>
            </span>
            <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-on-surface-container-low leading-tight">Waktunya Quest!</h1>
            <p data-design-text-token="title-md" class="font-title text-title-md text-primary">Kumpulkan Tugas PBO</p>
          </div>
        </div>

        <!-- Reward & Bonus Banner -->
        <div class="bg-accent-container text-on-accent-container border-2 border-outline rounded-md px-unit-md py-unit-sm flex items-center justify-between gap-unit-sm">
          <div class="flex items-center gap-unit-md">
            <span class="inline-flex items-center gap-unit-xs">
              <span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">star</span>
              <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">+120 XP</span>
            </span>
            <span class="inline-flex items-center gap-unit-xs">
              <span class="material-symbols-outlined text-accent text-[18px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">monetization_on</span>
              <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">+60 Coin</span>
            </span>
          </div>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">+20% Tanpa Snooze</span>
        </div>

        <!-- Interactive Status Feedback (Hidden until action clicked) -->
        <div id="alarm-feedback" class="hidden bg-surface-container-high text-on-surface-container-high border-2 border-outline rounded-md px-unit-md py-unit-sm text-center">
          <span id="alarm-feedback-text" data-design-text-token="label-lg" class="font-label text-label-lg"></span>
        </div>

        <!-- Primary Actions: Done & Snooze 10 menit -->
        <footer class="grid grid-cols-2 gap-unit-md">
          <button id="alarm-done-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="flex items-center justify-center gap-unit-xs bg-success text-on-success border-2 border-outline rounded-lg py-unit-md px-unit-sm pixel-shadow-md active:translate-y-[2px] transition-transform duration-button-press ease-button-press">
            <span class="material-symbols-outlined text-[20px]" aria-hidden="true">check_circle</span>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Done</span>
          </button>

          <button id="alarm-snooze-btn" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="flex items-center justify-center gap-unit-xs bg-secondary text-on-secondary border-2 border-outline rounded-lg py-unit-md px-unit-sm pixel-shadow-md active:translate-y-[2px] transition-transform duration-button-press ease-button-press">
            <span class="material-symbols-outlined text-[20px]" aria-hidden="true">snooze</span>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Snooze 10 mnt</span>
          </button>
        </footer>
      </article>

    </main>

    <!-- Bottom Customization Hint (Character & Ringtone Support) -->
    <footer class="flex items-center justify-center pb-unit-sm">
      <div class="inline-flex items-center gap-unit-sm bg-primary text-on-primary border-2 border-outline rounded-full px-unit-lg py-unit-xs pixel-shadow-sm">
        <span class="material-symbols-outlined text-accent text-[16px]" aria-hidden="true">music_note</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Nada: Pixel Chime • Hero: Hoodie Ungu</span>
      </div>
    </footer>

  </div>

  <script>
    (function () {
      var doneBtn = document.getElementById('alarm-done-btn');
      var snoozeBtn = document.getElementById('alarm-snooze-btn');
      var feedback = document.getElementById('alarm-feedback');
      var feedbackText = document.getElementById('alarm-feedback-text');

      if (doneBtn) {
        doneBtn.addEventListener('click', function () {
          if (!feedback || !feedbackText) return;
          feedbackText.textContent = 'Quest selesai! +144 XP (termasuk +20% tanpa snooze) & +60 Coin.';
          feedback.classList.remove('hidden');
        });
      }

      if (snoozeBtn) {
        snoozeBtn.addEventListener('click', function () {
          if (!feedback || !feedbackText) return;
          feedbackText.textContent = 'Alarm ditunda 10 menit — akan berbunyi lagi pukul 19:10.';
          feedback.classList.remove('hidden');
        });
      }
    })();
  </script>


</body></html>
