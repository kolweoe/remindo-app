  <script>
    (function () {
      var items = document.querySelectorAll('.costume-item');
      var equippedImg = document.getElementById('equipped-costume-img');
      var equippedName = document.getElementById('equipped-costume-name');
      var equippedBonus = document.getElementById('equipped-costume-bonus');
      var equipBtn = document.getElementById('equip-costume-btn');
      var unlockBtn = document.getElementById('unlock-costume-btn');
      var feedback = document.getElementById('costume-feedback');
      var feedbackText = document.getElementById('costume-feedback-text');
      var selected = items[0];

      function showMsg(msg) {
        if (!feedback || !feedbackText) return;
        feedbackText.textContent = msg;
        feedback.classList.remove('hidden');
      }

      items.forEach(function (item) {
        item.addEventListener('click', function () {
          items.forEach(function (el) {
            el.classList.remove('ring-2', 'ring-secondary');
          });
          item.classList.add('ring-2', 'ring-secondary');
          selected = item;
          showMsg('Dipilih: ' + item.getAttribute('data-costume') + ' (' + item.getAttribute('data-bonus') + ')');
        });
      });

      if (equipBtn) {
        equipBtn.addEventListener('click', function () {
          if (!selected) return;
          if (selected.getAttribute('data-locked') === 'true') {
            showMsg('Skin ' + selected.getAttribute('data-costume') + ' masih terkunci! Kumpulkan Coin.');
            return;
          }
          if (equippedImg && selected.getAttribute('data-img')) {
            equippedImg.src = selected.getAttribute('data-img');
          }
          if (equippedName) equippedName.textContent = selected.getAttribute('data-costume');
          if (equippedBonus) equippedBonus.textContent = selected.getAttribute('data-bonus');
          showMsg('Skin ' + selected.getAttribute('data-costume') + ' berhasil dipakai!');
        });
      }

      if (unlockBtn) {
        unlockBtn.addEventListener('click', function () {
          if (!selected || selected.getAttribute('data-locked') !== 'true') {
            showMsg('Kostum ini sudah terbuka!');
            return;
          }
          showMsg('Coin kamu 120 — butuh 380 Coin lagi untuk membuka ' + selected.getAttribute('data-costume') + '.');
        });
      }
    })();
  </script>
