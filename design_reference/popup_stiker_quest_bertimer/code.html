  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&amp;family=Capriola&amp;family=Spline+Sans+Mono:wght@600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
    .pixel-shadow-sm {
      box-shadow: 0 2px 0 #2D1B4E;
    }
    .pixel-shadow-md {
      box-shadow: 0 4px 0 #2D1B4E;
    }
    .pixel-shadow-card {
      box-shadow: 0 8px 0 #2D1B4E;
    }
  </style>
</head>
<body class="bg-surface-nav text-on-surface-nav antialiased">
  <div class="min-h-[884px] max-w-md mx-auto flex flex-col justify-between bg-surface-nav border-x-2 border-outline p-unit-lg relative overflow-hidden" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Simulated Phone Home / Other App Background (Dimmed) -->
    <div class="flex items-center justify-between text-outline-variant pb-unit-sm">
      <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">19:00</span>
      <span class="inline-flex items-center gap-unit-xs bg-primary text-on-primary border border-outline rounded-full px-unit-sm py-0">
        <span class="material-symbols-outlined text-accent text-[14px]" aria-hidden="true">layers</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Stiker Mengambang Aktif</span>
      </span>
      <span class="material-symbols-outlined text-[18px]" aria-hidden="true">battery_full</span>
    </div>

    <!-- Simulated Dimmed App Grid Behind Overlay -->
    <div class="grid grid-cols-4 gap-unit-md opacity-25 pointer-events-none select-none py-unit-md">
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
    </div>

    <!-- Floating Sticker Pengingat: Quest Bertimer (Minimalis) -->
    <main class="flex-1 flex flex-col items-center justify-center z-10">
      <article id="floating-timed-card" data-component-id="card-action" data-component-type="card" data-component-variant="action" class="w-full bg-surface-container-low text-on-surface-container-low border-2 border-outline rounded-xl p-unit-md pixel-shadow-card flex flex-col gap-unit-sm relative">
        <!-- Compact Header -->
        <div class="flex items-center justify-between gap-unit-sm">
          <span class="inline-flex items-center gap-unit-xs bg-primary text-on-primary border border-outline rounded-full px-unit-sm py-0">
            <span class="material-symbols-outlined text-accent text-[14px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">timer</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm">Quest Bertimer · 25:00</span>
          </span>
          <button id="close-sticker-btn" type="button" aria-label="Tutup stiker mengambang" class="w-7 h-7 inline-flex items-center justify-center bg-surface-container text-on-surface-container border border-outline rounded-md">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">close</span>
          </button>
        </div>

        <!-- Compact Pixel Sticker + Info -->
        <div class="flex items-center gap-unit-sm">
          <div class="w-16 h-16 bg-accent-container border-2 border-outline rounded-lg overflow-hidden shrink-0 pixel-shadow-sm">
            <img src="https://lh3.googleusercontent.com/aida/ALJJyrBAe0gkIW4SxBTNvtTDczJE3CtICTLG019kZIk1WNf26baYQ57iCFBY26sNh3_ljGGCRz9K48HSpLwO3wSnlJCdwQP4--VHVXJ2lgt-V9bXSEgtVjeecr0c4bDXfw4ghvNOU9BzM7NUGed6ntY9m8bzpKC_D3_reTisjFwrPGFjMzw1yfO7uhObvTu9SK5MoIz9WFSehiGxHUNlgxrB1pSFhcoUy0f7eDzXOuNgLU11xK6-u_uKkXX7Yts" alt="Stiker Hero Pengingat Quest Bertimer" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 flex flex-col gap-0 min-w-0">
            <h1 data-design-text-token="title-md" class="font-title text-title-md leading-tight">Baca 20 Halaman Buku</h1>
            <span data-design-text-token="mono-sm" class="font-mono text-mono-sm text-primary tabular-nums">+60 XP • +30 Coin</span>
          </div>
        </div>

        <!-- Feedback Banner -->
        <div id="sticker-feedback" class="hidden bg-accent-container text-on-accent-container border border-outline rounded-md px-unit-sm py-unit-xs text-center">
          <span id="sticker-feedback-text" data-design-text-token="label-sm" class="font-label text-label-sm"></span>
        </div>

        <!-- Minimalist Action Buttons -->
        <div class="flex flex-col gap-unit-xs">
          <button id="start-quest-bg-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="w-full flex items-center justify-center gap-unit-xs bg-primary text-on-primary border-2 border-outline rounded-lg py-unit-sm pixel-shadow-sm active:translate-y-[2px] transition-transform duration-button-press ease-button-press">
            <span class="material-symbols-outlined text-accent text-[18px]" aria-hidden="true">play_arrow</span>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Mulai Quest</span>
          </button>

          <div class="grid grid-cols-2 gap-unit-xs">
            <button id="snooze-timed-btn" type="button" class="flex items-center justify-center gap-unit-xs bg-secondary text-on-secondary border-2 border-outline rounded-lg py-unit-xs px-unit-sm pixel-shadow-sm">
              <span class="material-symbols-outlined text-[16px]" aria-hidden="true">snooze</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">Tunda 10m</span>
            </button>

            <a href="#quests" class="flex items-center justify-center gap-unit-xs bg-surface-container text-on-surface-container border-2 border-outline rounded-lg py-unit-xs px-unit-sm pixel-shadow-sm">
              <span class="material-symbols-outlined text-primary text-[16px]" aria-hidden="true">assignment</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">Quest</span>
            </a>
          </div>
        </div>
      </article>

      <!-- Minimized Background Timer Pill (shown after Mulai Quest) -->
      <a id="bg-timer-pill" href="#timed-quest" class="hidden bg-primary text-on-primary border-2 border-outline rounded-full px-unit-md py-unit-sm pixel-shadow-md flex items-center gap-unit-sm">
        <span class="material-symbols-outlined text-accent text-[18px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">timer</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Popup ditutup · Timer 25:00 berjalan di latar belakang</span>
      </a>
    </main>

    <!-- Bottom Hint -->
    <footer class="flex items-center justify-center pt-unit-md">
      <span data-design-text-token="label-sm" class="font-label text-label-sm text-outline-variant">Mengambang di atas aplikasi lain · Remindo</span>
    </footer>

  </div>

  <script>
    (function () {
      var card = document.getElementById('floating-timed-card');
      var bgPill = document.getElementById('bg-timer-pill');
      var startBtn = document.getElementById('start-quest-bg-btn');
      var snoozeBtn = document.getElementById('snooze-timed-btn');
      var closeBtn = document.getElementById('close-sticker-btn');
      var feedback = document.getElementById('sticker-feedback');
      var feedbackText = document.getElementById('sticker-feedback-text');

      if (startBtn) {
        startBtn.addEventListener('click', function () {
          if (card) card.classList.add('hidden');
          if (bgPill) bgPill.classList.remove('hidden');
        });
      }
      if (snoozeBtn) {
        snoozeBtn.addEventListener('click', function () {
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Ditunda 10 menit (19:10).';
            feedback.classList.remove('hidden');
          }
        });
      }
      if (closeBtn) {
        closeBtn.addEventListener('click', function () {
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Stiker disembunyikan ke notifikasi.';
            feedback.classList.remove('hidden');
          }
        });
      }
    })();
  </script>


</body></html>
