  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">

      width: 1em;
      height: 1em;

<body class="bg-surface text-on-surface antialiased">
  <div class="min-h-[884px] max-w-md mx-auto flex flex-col bg-surface border-x-2 border-outline relative" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Contextual Task Flow Header -->
    <header class="bg-surface-nav text-on-surface-nav border-b-2 border-outline px-unit-md py-unit-sm z-20 flex items-center justify-between gap-unit-sm">
      <a href="#hero" aria-label="Kembali ke Hero" class="inline-flex items-center justify-center w-10 h-10 bg-primary text-on-primary border-2 border-outline rounded-md pixel-shadow-sm">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </a>

      <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-center">Pilih Pet</h1>

      <div class="flex items-center gap-unit-xs bg-primary text-on-primary border-2 border-outline rounded-full px-unit-sm py-unit-xs pixel-shadow-sm shrink-0">
        <span class="material-symbols-outlined text-accent text-[16px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">monetization_on</span>
        <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">120</span>
      </div>
    </header>

    <!-- Main Pet Selection Content -->
    <main class="flex-1 flex flex-col justify-between gap-unit-md p-unit-lg">

      <div class="flex flex-col gap-unit-md">
        <!-- Active Pet Showcase Card -->
        <article data-component-id="card-elevated" data-component-type="card" data-component-variant="elevated" class="bg-surface-container-low text-on-surface-container-low border-2 border-outline rounded-xl p-unit-md pixel-shadow-card flex items-center gap-unit-md">
          <div class="w-20 h-20 bg-surface-container border-2 border-outline rounded-lg overflow-hidden shrink-0 pixel-shadow-sm">
            <img src="https://lh3.googleusercontent.com/aida/ALJJyrCIeUUFtDgPk-yW7AEnFX4qljESoI1orIn7oADJaSwh80sAbE7PDbzMP83M6p9oTvP6IqZwwfIUqWfkyzlwAWys9dS-D_k5j7Jzb1CJnuj8ApdTvK5jzq8Jjq4IAKex_aUQNrzrwtiTSda6zrknvvd48yX7i3_gCSVT22H13edFUxMel5JTxwQcnIjkK2upubVePuoxM_dBrINH_D7HSySuOPFeV5JLAusxG7fnjGZMYBpOu9z_Pg" alt="Kucing tuxedo pixel art dengan lonceng emas" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 flex flex-col gap-unit-xs min-w-0">
            <div class="flex items-center justify-between gap-unit-xs">
              <span data-design-text-token="label-sm" class="font-label text-label-sm">Pet Aktif</span>
              <span class="bg-success text-on-success border border-outline rounded-sm px-unit-xs py-0 shrink-0">
                <span data-design-text-token="label-sm" class="font-label text-label-sm">DIPAKAI</span>
              </span>
            </div>
            <h2 id="active-pet-name" data-design-text-token="title-md" class="font-title text-title-md">Kucing Tuxedo • Lv.3</h2>
            <span id="active-pet-bonus" data-design-text-token="label-sm" class="font-label text-label-sm text-primary">Bonus: +10% XP Harian</span>
          </div>
        </article>

        <!-- Feedback Banner -->
        <div id="pet-feedback" class="hidden bg-accent-container text-on-accent-container border-2 border-outline rounded-md px-unit-md py-unit-xs text-center">
          <span id="pet-feedback-text" data-design-text-token="label-sm" class="font-label text-label-sm"></span>
        </div>

        <!-- Pet Collection 2x2 Grid -->
        <article data-component-id="card-elevated" data-component-type="card" data-component-variant="elevated" class="bg-surface-container-low text-on-surface-container-low border-2 border-outline rounded-xl p-unit-md pixel-shadow-card flex flex-col gap-unit-md">
          <div class="flex items-center justify-between">
            <h2 data-design-text-token="title-md" class="font-title text-title-md">Koleksi Pet</h2>
            <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">2 / 4</span>
          </div>

          <div class="grid grid-cols-2 gap-unit-sm">
            <!-- Pet 1: Kucing Tuxedo (Active) -->
            <button type="button" data-pet="Kucing Tuxedo • Lv.3" data-bonus="Bonus: +10% XP Harian" data-locked="false" class="pet-card bg-accent-container text-on-accent-container border-2 border-outline rounded-lg p-unit-sm flex flex-col items-center gap-unit-xs pixel-shadow-sm">
              <div class="w-14 h-14 rounded-md overflow-hidden border-2 border-outline bg-surface-container-low">
                <img src="https://lh3.googleusercontent.com/aida/ALJJyrCIeUUFtDgPk-yW7AEnFX4qljESoI1orIn7oADJaSwh80sAbE7PDbzMP83M6p9oTvP6IqZwwfIUqWfkyzlwAWys9dS-D_k5j7Jzb1CJnuj8ApdTvK5jzq8Jjq4IAKex_aUQNrzrwtiTSda6zrknvvd48yX7i3_gCSVT22H13edFUxMel5JTxwQcnIjkK2upubVePuoxM_dBrINH_D7HSySuOPFeV5JLAusxG7fnjGZMYBpOu9z_Pg" alt="Kucing Tuxedo" class="w-full h-full object-cover">
              </div>
              <span data-design-text-token="label-lg" class="font-label text-label-lg text-center">Kucing Tuxedo</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">+10% XP Harian</span>
              <span class="bg-success text-on-success border border-outline rounded-sm px-unit-xs py-0">
                <span data-design-text-token="label-sm" class="font-label text-label-sm">Dipakai</span>
              </span>
            </button>

            <!-- Pet 2: Rubah Pixel (Unlocked) -->
            <button type="button" data-pet="Rubah Pixel • Lv.1" data-bonus="Bonus: +15% Waktu Fokus" data-locked="false" class="pet-card bg-surface-container text-on-surface-container border-2 border-outline rounded-lg p-unit-sm flex flex-col items-center gap-unit-xs pixel-shadow-sm">
              <div class="w-14 h-14 rounded-md border-2 border-outline bg-secondary-container flex items-center justify-center">
                <span class="material-symbols-outlined text-secondary text-[32px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">pets</span>
              </div>
              <span data-design-text-token="label-lg" class="font-label text-label-lg text-center">Rubah Pixel</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">+15% Fokus</span>
              <span class="bg-primary text-on-primary border border-outline rounded-sm px-unit-xs py-0">
                <span data-design-text-token="label-sm" class="font-label text-label-sm">Terbuka</span>
              </span>
            </button>

            <!-- Pet 3: Burung Hantu (Locked) -->
            <button type="button" data-pet="Burung Hantu" data-bonus="Bonus: +20% XP Belajar" data-locked="true" data-cost="300" class="pet-card bg-surface-container-high text-on-surface-container-high border-2 border-outline rounded-lg p-unit-sm flex flex-col items-center gap-unit-xs">
              <div class="w-14 h-14 rounded-md border-2 border-outline bg-surface-container flex items-center justify-center">
                <span class="material-symbols-outlined text-on-surface-container-high text-[32px]" aria-hidden="true">lock</span>
              </div>
              <span data-design-text-token="label-lg" class="font-label text-label-lg text-center">Burung Hantu</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">+20% Belajar</span>
              <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">300 Coin</span>
            </button>

            <!-- Pet 4: Naga Mini (Locked) -->
            <button type="button" data-pet="Naga Mini" data-bonus="Bonus: +25% Coin Quest" data-locked="true" data-cost="800" class="pet-card bg-surface-container-high text-on-surface-container-high border-2 border-outline rounded-lg p-unit-sm flex flex-col items-center gap-unit-xs">
              <div class="w-14 h-14 rounded-md border-2 border-outline bg-surface-container flex items-center justify-center">
                <span class="material-symbols-outlined text-on-surface-container-high text-[32px]" aria-hidden="true">lock</span>
              </div>
              <span data-design-text-token="label-lg" class="font-label text-label-lg text-center">Naga Mini</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">+25% Coin</span>
              <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">800 Coin</span>
            </button>
          </div>
        </article>
      </div>

      <!-- Bottom Actions -->
      <div class="grid grid-cols-2 gap-unit-sm pt-unit-xs">
        <button id="equip-pet-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="bg-primary text-on-primary border-2 border-outline rounded-lg py-unit-md pixel-shadow-md active:translate-y-[2px] transition-transform duration-button-press ease-button-press">
          <span data-design-text-token="label-lg" class="font-label text-label-lg">Pasang Pet</span>
        </button>

        <button id="unlock-pet-btn" type="button" class="bg-accent text-on-accent border-2 border-outline rounded-lg py-unit-md pixel-shadow-md active:translate-y-[2px] transition-transform duration-button-press ease-button-press">
          <span data-design-text-token="label-lg" class="font-label text-label-lg">Buka (Coin)</span>
        </button>
      </div>

    </main>

  </div>

  <script>
    (function () {
      var cards = document.querySelectorAll('.pet-card');
      var activeName = document.getElementById('active-pet-name');
      var activeBonus = document.getElementById('active-pet-bonus');
      var equipBtn = document.getElementById('equip-pet-btn');
      var unlockBtn = document.getElementById('unlock-pet-btn');
      var feedback = document.getElementById('pet-feedback');
      var feedbackText = document.getElementById('pet-feedback-text');
      var selected = cards[0];

      function showMsg(msg) {
        if (!feedback || !feedbackText) return;
        feedbackText.textContent = msg;
        feedback.classList.remove('hidden');
      }

      cards.forEach(function (card) {
        card.addEventListener('click', function () {
          cards.forEach(function (c) {
            c.classList.remove('ring-2', 'ring-secondary');
          });
          card.classList.add('ring-2', 'ring-secondary');
          selected = card;
          showMsg('Dipilih: ' + card.getAttribute('data-pet') + ' (' + card.getAttribute('data-bonus') + ')');
        });
      });

      if (equipBtn) {
        equipBtn.addEventListener('click', function () {
          if (!selected) return;
          if (selected.getAttribute('data-locked') === 'true') {
            showMsg(selected.getAttribute('data-pet') + ' masih terkunci! Butuh ' + selected.getAttribute('data-cost') + ' Coin.');
            return;
          }
          if (activeName) activeName.textContent = selected.getAttribute('data-pet');
          if (activeBonus) activeBonus.textContent = selected.getAttribute('data-bonus');
          showMsg('Pet aktif diganti ke ' + selected.getAttribute('data-pet') + '!');
        });
      }

      if (unlockBtn) {
        unlockBtn.addEventListener('click', function () {
          if (!selected || selected.getAttribute('data-locked') !== 'true') {
            showMsg('Pet ini sudah terbuka!');
            return;
          }
          var cost = parseInt(selected.getAttribute('data-cost') || '0', 10);
          var need = Math.max(0, cost - 120);
          showMsg('Coin kamu 120 — butuh ' + need + ' Coin lagi untuk membuka ' + selected.getAttribute('data-pet') + '.');
        });
      }
    })();
  </script>


</body></html>
