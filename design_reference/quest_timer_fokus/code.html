  <script>
    (function () {
      var totalSeconds = 25 * 60;
      var remaining = totalSeconds;
      var intervalId = null;

      var display = document.getElementById('timer-display');
      var bar = document.getElementById('timer-bar');
      var toggleBtn = document.getElementById('timer-toggle-btn');
      var toggleIcon = document.getElementById('timer-toggle-icon');
      var toggleLabel = document.getElementById('timer-toggle-label');
      var resetBtn = document.getElementById('timer-reset-btn');
      var completeBtn = document.getElementById('timer-complete-btn');
      var feedback = document.getElementById('timer-feedback');
      var feedbackText = document.getElementById('timer-feedback-text');
      var musicToggleBtn = document.getElementById('music-toggle-btn');
      var musicToggleLabel = document.getElementById('music-toggle-label');
      var musicNowPlaying = document.getElementById('music-now-playing');
      var trackBtns = document.querySelectorAll('.track-btn');
      var musicVolume = document.getElementById('music-volume');
      var musicVolumeVal = document.getElementById('music-volume-val');

      var isMusicOn = true;
      var selectedTrack = 'Lo-Fi Hujan';

      function updateMusicStatus() {
        if (!musicNowPlaying) return;
        musicNowPlaying.textContent = isMusicOn
          ? 'Sedang diputar: ' + selectedTrack
          : 'Musik dijeda (' + selectedTrack + ')';
      }

      if (musicToggleBtn) {
        musicToggleBtn.addEventListener('click', function () {
          isMusicOn = !isMusicOn;
          musicToggleBtn.setAttribute('aria-checked', String(isMusicOn));
          if (isMusicOn) {
            musicToggleBtn.classList.remove('bg-surface-container-high', 'text-on-surface-container-high', 'justify-start');
            musicToggleBtn.classList.add('bg-success', 'text-on-success', 'justify-end');
            if (musicToggleLabel) musicToggleLabel.textContent = 'ON';
          } else {
            musicToggleBtn.classList.remove('bg-success', 'text-on-success', 'justify-end');
            musicToggleBtn.classList.add('bg-surface-container-high', 'text-on-surface-container-high', 'justify-start');
            if (musicToggleLabel) musicToggleLabel.textContent = 'OFF';
          }
          updateMusicStatus();
        });
      }

      trackBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          selectedTrack = btn.getAttribute('data-track') || 'Lo-Fi Hujan';
          trackBtns.forEach(function (other) {
            var active = other === btn;
            other.setAttribute('aria-pressed', active ? 'true' : 'false');
            if (active) {
              other.classList.remove('bg-surface-container', 'text-on-surface-container');
              other.classList.add('bg-accent-container', 'text-on-accent-container');
            } else {
              other.classList.remove('bg-accent-container', 'text-on-accent-container');
              other.classList.add('bg-surface-container', 'text-on-surface-container');
            }
          });
          updateMusicStatus();
        });
      });

      if (musicVolume && musicVolumeVal) {
        musicVolume.addEventListener('input', function () {
          musicVolumeVal.textContent = musicVolume.value + '%';
        });
      }

      function formatTime(sec) {
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        var s = sec % 60;
        return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function render() {
        if (display) display.textContent = formatTime(remaining);
        if (bar) bar.style.width = Math.round((remaining / totalSeconds) * 100) + '%';
      }

      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
            if (toggleIcon) toggleIcon.textContent = 'play_arrow';
            if (toggleLabel) toggleLabel.textContent = 'Lanjut';
          } else {
            if (toggleIcon) toggleIcon.textContent = 'pause';
            if (toggleLabel) toggleLabel.textContent = 'Jeda';
            intervalId = setInterval(function () {
              if (remaining > 0) {
                remaining -= 1;
                render();
              } else {
                clearInterval(intervalId);
                intervalId = null;
              }
            }, 1000);
          }
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function () {
          if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
          }
          remaining = totalSeconds;
          render();
          if (toggleIcon) toggleIcon.textContent = 'play_arrow';
          if (toggleLabel) toggleLabel.textContent = 'Mulai';
        });
      }

      if (completeBtn) {
        completeBtn.addEventListener('click', function () {
          if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
          }
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Quest selesai tepat waktu! +144 XP & +60 Coin diraih!';
            feedback.classList.remove('hidden');
          }
        });
      }
    })();
  </script>
