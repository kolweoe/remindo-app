<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */

        'primary-container': '#F9B98F',

        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
        'label-lg': ['13px', { lineHeight: '18px', letterSpacing: '0.1px', fontWeight: '400' }],
        'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.2px', fontWeight: '400' }],

  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&amp;family=Capriola&amp;family=Spline+Sans+Mono:wght@600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
    .pixel-shadow-sm {
      box-shadow: 0 2px 0 #2D1B4E;
    }
    .pixel-shadow-md {
      box-shadow: 0 4px 0 #2D1B4E;
    }
    .pixel-shadow-card {
      box-shadow: 0 8px 0 #2D1B4E;
    }
  </style>
</head>
<body class="bg-surface-nav text-on-surface-nav antialiased">
  <div class="min-h-[884px] max-w-md mx-auto flex flex-col justify-between bg-surface-nav border-x-2 border-outline p-unit-lg relative overflow-hidden" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Simulated Phone Status Bar -->
    <div class="flex items-center justify-between text-outline-variant pb-unit-sm">
      <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">14:30</span>
      <span class="inline-flex items-center gap-unit-xs bg-primary text-on-primary border border-outline rounded-full px-unit-sm py-0">
        <span class="material-symbols-outlined text-accent text-[14px]" aria-hidden="true">layers</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Stiker Mengambang Aktif</span>
      </span>
      <span class="material-symbols-outlined text-[18px]" aria-hidden="true">battery_full</span>
    </div>

    <!-- Simulated Dimmed App Grid Behind Overlay -->
    <div class="grid grid-cols-4 gap-unit-md opacity-25 pointer-events-none select-none py-unit-md">
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
    </div>

    <!-- Floating Sticker Pengingat: Quest Tanpa Timer (Minimalis) -->
    <main class="flex-1 flex flex-col items-center justify-center z-10">
      <article data-component-id="card-action" data-component-type="card" data-component-variant="action" class="w-full bg-surface-container-low text-on-surface-container-low border-2 border-outline rounded-xl p-unit-md pixel-shadow-card flex flex-col gap-unit-sm relative">
        <!-- Compact Header -->
        <div class="flex items-center justify-between gap-unit-sm">
          <span class="inline-flex items-center gap-unit-xs bg-success text-on-success border border-outline rounded-full px-unit-sm py-0">
            <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">check_box</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm">Pengingat Quest</span>
          </span>
          <button id="close-reminder-sticker" type="button" aria-label="Tutup stiker pengingat" class="w-7 h-7 inline-flex items-center justify-center bg-surface-container text-on-surface-container border border-outline rounded-md">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">close</span>
          </button>
        </div>

        <!-- Compact Pixel Pet Sticker + Quest Info -->
        <div class="flex items-center gap-unit-sm">
          <div class="w-16 h-16 bg-accent-container border-2 border-outline rounded-lg overflow-hidden shrink-0 pixel-shadow-sm">
            <img src="https://lh3.googleusercontent.com/aida/ALJJyrCIeUUFtDgPk-yW7AEnFX4qljESoI1orIn7oADJaSwh80sAbE7PDbzMP83M6p9oTvP6IqZwwfIUqWfkyzlwAWys9dS-D_k5j7Jzb1CJnuj8ApdTvK5jzq8Jjq4IAKex_aUQNrzrwtiTSda6zrknvvd48yX7i3_gCSVT22H13edFUxMel5JTxwQcnIjkK2upubVePuoxM_dBrINH_D7HSySuOPFeV5JLAusxG7fnjGZMYBpOu9z_Pg" alt="Stiker Kucing Tuxedo Pengingat Quest" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 flex flex-col gap-0 min-w-0">
            <h1 data-design-text-token="title-md" class="font-title text-title-md leading-tight">Minum 8 Gelas Air</h1>
            <span data-design-text-token="mono-sm" class="font-mono text-mono-sm text-primary tabular-nums">+30 XP • +15 Coin</span>
          </div>
        </div>

        <!-- Feedback Banner -->
        <div id="reminder-sticker-feedback" class="hidden bg-accent-container text-on-accent-container border border-outline rounded-md px-unit-sm py-unit-xs text-center">
          <span id="reminder-sticker-feedback-text" data-design-text-token="label-sm" class="font-label text-label-sm"></span>
        </div>

        <!-- Minimalist Action Buttons -->
        <div class="flex flex-col gap-unit-xs">
          <button id="quick-check-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="w-full flex items-center justify-center gap-unit-xs bg-success text-on-success border-2 border-outline rounded-lg py-unit-sm pixel-shadow-sm active:translate-y-[2px] transition-transform duration-button-press ease-button-press">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">check_circle</span>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Centang Selesai (+30 XP)</span>
          </button>

          <div class="grid grid-cols-2 gap-unit-xs">
            <button id="snooze-reminder-btn" type="button" class="flex items-center justify-center gap-unit-xs bg-secondary text-on-secondary border-2 border-outline rounded-lg py-unit-xs px-unit-sm pixel-shadow-sm">
              <span class="material-symbols-outlined text-[16px]" aria-hidden="true">snooze</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">Tunda 15m</span>
            </button>

            <a href="#quests" class="flex items-center justify-center gap-unit-xs bg-surface-container text-on-surface-container border-2 border-outline rounded-lg py-unit-xs px-unit-sm pixel-shadow-sm">
              <span class="material-symbols-outlined text-primary text-[16px]" aria-hidden="true">assignment</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">Quest</span>
            </a>
          </div>
        </div>
      </article>
    </main>

    <!-- Bottom Hint -->
    <footer class="flex items-center justify-center pt-unit-md">
      <span data-design-text-token="label-sm" class="font-label text-label-sm text-outline-variant">Mengambang di atas aplikasi lain · Remindo</span>
    </footer>

  </div>

  <script>
    (function () {
      var checkBtn = document.getElementById('quick-check-btn');
      var snoozeBtn = document.getElementById('snooze-reminder-btn');
      var closeBtn = document.getElementById('close-reminder-sticker');
      var feedback = document.getElementById('reminder-sticker-feedback');
      var feedbackText = document.getElementById('reminder-sticker-feedback-text');

      if (checkBtn) {
        checkBtn.addEventListener('click', function () {
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Quest dicentang! +30 XP & +15 Coin langsung masuk ke Hero.';
            feedback.classList.remove('hidden');
          }
        });
      }
      if (snoozeBtn) {
        snoozeBtn.addEventListener('click', function () {
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Pengingat ditunda 15 menit — muncul lagi pukul 14:45.';
            feedback.classList.remove('hidden');
          }
        });
      }
      if (closeBtn) {
        closeBtn.addEventListener('click', function () {
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Stiker disembunyikan ke bilah notifikasi.';
            feedback.classList.remove('hidden');
          }
        });
      }
    })();
  </script>


</body></html>
