<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        'accent-container': '#FEF3C7',

      },
      fontSize: {

      transitionDuration: {

        'surface-enter': '220ms',
      },
      transitionDelay: {
        'button-press': '0ms',
        'surface-enter': '0ms',
      },
      transitionTimingFunction: {
        'button-press': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',
      },
    },

if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&amp;family=Capriola&amp;family=Spline+Sans+Mono:wght@600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
    .pixel-shadow-sm {
      box-shadow: 0 2px 0 #2D1B4E;
    }
    .pixel-shadow-md {
      box-shadow: 0 4px 0 #2D1B4E;
    }
    .pixel-shadow-card {
      box-shadow: 0 8px 0 #2D1B4E;
    }
  </style>
</head>
<body class="bg-surface-nav text-on-surface-nav antialiased">
  <div class="min-h-[884px] max-w-md mx-auto flex flex-col justify-between bg-surface-nav border-x-2 border-outline p-unit-lg relative overflow-hidden" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Simulated Phone Status Bar -->
    <div class="flex items-center justify-between text-outline-variant pb-unit-sm">
      <span data-design-text-token="mono-sm" class="font-mono text-mono-sm tabular-nums">20:00</span>
      <span class="inline-flex items-center gap-unit-xs bg-primary text-on-primary border border-outline rounded-full px-unit-sm py-0">
        <span class="material-symbols-outlined text-accent text-[14px]" aria-hidden="true">layers</span>
        <span data-design-text-token="label-sm" class="font-label text-label-sm">Stiker Mengambang Aktif</span>
      </span>
      <span class="material-symbols-outlined text-[18px]" aria-hidden="true">battery_full</span>
    </div>

    <!-- Simulated Dimmed App Grid Behind Overlay -->
    <div class="grid grid-cols-4 gap-unit-md opacity-25 pointer-events-none select-none py-unit-md">
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
      <div class="h-12 bg-surface-container rounded-xl border border-outline"></div>
    </div>

    <!-- Floating Sticker: Laporan Keuangan & Input Rutin (Minimalis) -->
    <main class="flex-1 flex flex-col items-center justify-center z-10">
      <article data-component-id="card-action" data-component-type="card" data-component-variant="action" class="w-full bg-surface-container-low text-on-surface-container-low border-2 border-outline rounded-xl p-unit-md pixel-shadow-card flex flex-col gap-unit-sm relative">
        <!-- Compact Header -->
        <div class="flex items-center justify-between gap-unit-sm">
          <span class="inline-flex items-center gap-unit-xs bg-primary text-on-primary border border-outline rounded-full px-unit-sm py-0">
            <span class="material-symbols-outlined text-accent text-[14px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">account_balance_wallet</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm">Laporan &amp; Input Rutin</span>
          </span>
          <button id="close-wallet-sticker" type="button" aria-label="Tutup stiker dompet" class="w-7 h-7 inline-flex items-center justify-center bg-surface-container text-on-surface-container border border-outline rounded-md">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">close</span>
          </button>
        </div>

        <!-- Compact Sticker + Saldo -->
        <div class="flex items-center gap-unit-sm">
          <div class="w-16 h-16 bg-accent-container border-2 border-outline rounded-lg overflow-hidden shrink-0 pixel-shadow-sm">
            <img src="https://lh3.googleusercontent.com/aida/ALJJyrBAe0gkIW4SxBTNvtTDczJE3CtICTLG019kZIk1WNf26baYQ57iCFBY26sNh3_ljGGCRz9K48HSpLwO3wSnlJCdwQP4--VHVXJ2lgt-V9bXSEgtVjeecr0c4bDXfw4ghvNOU9BzM7NUGed6ntY9m8bzpKC_D3_reTisjFwrPGFjMzw1yfO7uhObvTu9SK5MoIz9WFSehiGxHUNlgxrB1pSFhcoUy0f7eDzXOuNgLU11xK6-u_uKkXX7Yts" alt="Stiker Hero Pengingat Laporan Keuangan" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 flex flex-col gap-0 min-w-0">
            <h1 data-design-text-token="title-md" class="font-title text-title-md leading-tight">Rekap Dompetku</h1>
            <span data-design-text-token="mono-sm" class="font-mono text-mono-sm text-primary tabular-nums">Saldo: Rp 850.000</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm">+Rp 150K Masuk • -Rp 45K Keluar</span>
          </div>
        </div>

        <!-- Quick Routine Input Pills -->
        <div class="grid grid-cols-2 gap-unit-xs">
          <button id="quick-expense-btn" type="button" class="bg-surface-container text-on-surface-container border border-outline rounded-md py-unit-xs px-unit-sm flex items-center justify-center gap-unit-xs">
            <span class="material-symbols-outlined text-error text-[16px]" aria-hidden="true">remove_circle</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm">Makan -20K</span>
          </button>
          <button id="quick-income-btn" type="button" class="bg-surface-container text-on-surface-container border border-outline rounded-md py-unit-xs px-unit-sm flex items-center justify-center gap-unit-xs">
            <span class="material-symbols-outlined text-success text-[16px]" aria-hidden="true">add_circle</span>
            <span data-design-text-token="label-sm" class="font-label text-label-sm">Saku +50K</span>
          </button>
        </div>

        <!-- Feedback Banner -->
        <div id="wallet-sticker-feedback" class="hidden bg-accent-container text-on-accent-container border border-outline rounded-md px-unit-sm py-unit-xs text-center">
          <span id="wallet-sticker-feedback-text" data-design-text-token="label-sm" class="font-label text-label-sm"></span>
        </div>

        <!-- Minimalist Action Buttons -->
        <div class="flex flex-col gap-unit-xs">
          <a href="#add-transaction" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full flex items-center justify-center gap-unit-xs bg-primary text-on-primary border-2 border-outline rounded-lg py-unit-sm pixel-shadow-sm active:translate-y-[2px] transition-transform duration-button-press ease-button-press">
            <span class="material-symbols-outlined text-accent text-[18px]" aria-hidden="true">payments</span>
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Catat Transaksi</span>
          </a>

          <div class="grid grid-cols-2 gap-unit-xs">
            <a href="#wallet" class="flex items-center justify-center gap-unit-xs bg-secondary text-on-secondary border-2 border-outline rounded-lg py-unit-xs px-unit-sm pixel-shadow-sm">
              <span class="material-symbols-outlined text-[16px]" aria-hidden="true">account_balance_wallet</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">Dompetku</span>
            </a>

            <a href="#wallet-notification" class="flex items-center justify-center gap-unit-xs bg-surface-container text-on-surface-container border-2 border-outline rounded-lg py-unit-xs px-unit-sm pixel-shadow-sm">
              <span class="material-symbols-outlined text-primary text-[16px]" aria-hidden="true">notifications_active</span>
              <span data-design-text-token="label-sm" class="font-label text-label-sm">Jadwal</span>
            </a>
          </div>
        </div>
      </article>
    </main>

    <!-- Bottom Hint -->
    <footer class="flex items-center justify-center pt-unit-md">
      <span data-design-text-token="label-sm" class="font-label text-label-sm text-outline-variant">Mengambang di atas aplikasi lain · Remindo</span>
    </footer>

  </div>

  <script>
    (function () {
      var expBtn = document.getElementById('quick-expense-btn');
      var incBtn = document.getElementById('quick-income-btn');
      var closeBtn = document.getElementById('close-wallet-sticker');
      var feedback = document.getElementById('wallet-sticker-feedback');
      var feedbackText = document.getElementById('wallet-sticker-feedback-text');

      if (expBtn) {
        expBtn.addEventListener('click', function () {
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Pengeluaran rutin -Rp 20.000 tercatat ke Dompetku!';
            feedback.classList.remove('hidden');
          }
        });
      }
      if (incBtn) {
        incBtn.addEventListener('click', function () {
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Pemasukan rutin +Rp 50.000 tercatat ke Dompetku!';
            feedback.classList.remove('hidden');
          }
        });
      }
      if (closeBtn) {
        closeBtn.addEventListener('click', function () {
          if (feedback && feedbackText) {
            feedbackText.textContent = 'Stiker disembunyikan ke bilah notifikasi.';
            feedback.classList.remove('hidden');
          }
        });
      }
    })();
  </script>


</body></html>
